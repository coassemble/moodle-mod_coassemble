name: Bug report
description: Report a reproducible problem with the Coassemble Moodle plugin.
body:
  - type: markdown
    attributes:
      value: Do not include API keys, signed embed URLs, or learner personal data. Redact screenshots and logs.
  - type: input
    id: versions
    attributes:
      label: Moodle, PHP and plugin versions
      description: Include the Coassemble plugin release from version.php.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the affected workflow, user role, group mode and theme when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and redacted evidence
      description: Include relevant HTTP status and operation from Moodle's event log.
    validations:
      required: true
