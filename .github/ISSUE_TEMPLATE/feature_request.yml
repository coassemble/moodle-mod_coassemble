name: Feature request
description: Suggest an improvement to the Coassemble Moodle plugin.
body:
  - type: textarea
    id: problem
    attributes:
      label: User need
      description: Describe the Moodle workflow and the problem you want to solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
    validations:
      required: true
